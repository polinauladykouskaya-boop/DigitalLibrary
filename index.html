<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitalLibrary &mdash; Электронная библиотека</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/reviews.css" />
  <link rel="stylesheet" href="css/favorites.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <a href="#main-content-slot" class="skip-link">Перейти к основному содержимому</a>

  <header class="header">
    <div class="header__top">
      <img class="header__logo" src="images/logo.png" alt="Логотип библиотеки Digital Library" />
      <button class="header__burger" id="burger">&equiv;</button>
      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a href="#" class="nav__link" data-page="home">Главная</a>
          </li>
          <li class="nav__item">
            <a href="#" class="nav__link" data-page="catalog">Каталог</a>
          </li>
          <li class="nav__item">
            <a href="#" class="nav__link" data-page="news-page">Новости</a>
          </li>
        </ul>
      </nav>
    </div>
    <div class="header__bottom">
      <h1 class="header__title">Digital Library</h1>
    </div>
  </header>

  <div class="user-panel">
    <div class="user-panel__container">
      <div class="search-widget">
  <h3 class="search-widget__title">Поиск</h3>
  <div class="search-widget__container" style="position: relative;">
    <input type="text" id="search-input" class="search-widget__input" placeholder="Поиск по названию..." autocomplete="off">
    <div id="search-suggestions" class="search-widget__suggestions" style="position: absolute; width: 100%; z-index: 100; background: var(--color-card); border-radius: 0 0 8px 8px; display: none;"></div>
  </div>
</div>
      <div id="favorites-sidebar-container"></div>
    </div>
  </div>

  <div class="layout">
    <main class="main-content" id="main-content-slot">
      <section id="home-page" class="page-section">
        <div class="page-header">
          <h2 class="section__title">Новости библиотеки</h2>
          <button class="button button--primary" id="add-news-btn">Добавить новость</button>
        </div>
        <div id="news-list-container" class="news-grid"></div>
      </section>

      <section id="catalog-page" class="page-section" style="display: none;">
        <div class="page-header">
          <h2 class="section__title">Каталог элементов</h2>
          <div class="catalog-controls">
            <select id="catalog-sort" class="form-input">
              <option value="date-desc">Сначала новые</option>
              <option value="date-asc">Сначала старые</option>
              <option value="name-asc">Название (А-Я)</option>
              <option value="name-desc">Название (Я-А)</option>
            </select>
            <button class="button button--primary" id="add-item-btn">Добавить элемент</button>
          </div>
        </div>
        <div id="catalog-list-container" class="similar__grid"></div>
      </section>

      <section id="details-page" class="page-section" style="display: none;">
        <div id="item-details-container"></div>
      </section>
    </main>

    <aside class="sidebar">
      <h2 class="sidebar__title">Информация о библиотеке</h2>
      <div id="sidebar-info-content">
        <p class="sidebar__text">Добро пожаловать в цифровую библиотеку.</p>
      </div>
    </aside>
  </div>

  <div id="modal-container" class="modal">
    <div class="modal__content">
      <button class="modal__close" id="modal-close">&times;</button>
      <div id="modal-form-slot"></div>
    </div>
  </div>

  <template id="news-form-template">
    <form id="news-form" class="reviews-form">
      <h3 class="reviews-form__title">Управление новостью</h3>
      <input type="hidden" id="news-edit-id">
      <div class="form-group">
        <label for="news-title" class="form-label">Заголовок:</label>
        <input type="text" id="news-title" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="news-date" class="form-label">Дата:</label>
        <input type="date" id="news-date" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="news-text" class="form-label">Текст новости:</label>
        <textarea id="news-text" class="form-textarea" rows="5" required></textarea>
      </div>
      <button type="submit" class="button button--primary">Сохранить</button>
    </form>
  </template>

  <template id="item-form-template">
    <form id="item-form" class="reviews-form">
      <h3 class="reviews-form__title">Управление элементом</h3>
      <input type="hidden" id="item-edit-id">
      <div class="form-group">
        <label for="item-name" class="form-label">Название:</label>
        <input type="text" id="item-name" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="item-date" class="form-label">Дата создания:</label>
        <input type="date" id="item-date" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="item-description" class="form-label">Описание:</label>
        <textarea id="item-description" class="form-textarea" rows="4" required></textarea>
      </div>
      <button type="submit" class="button button--primary">Сохранить</button>
    </form>
  </template>

  <footer class="footer">
    <p class="footer__text">&copy; 2026 Digital Library. Все права защищены.</p>
  </footer>

  <script type="module" src="js/script.js"></script>
</body>
</html>
