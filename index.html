<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitalLibrary</title>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/reviews.css" />
  <link rel="stylesheet" href="css/favorites.css" />
  <link rel="stylesheet" href="css/footer.css" />

  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>

<body>

<header class="header">
  <div class="header__top">
    <img class="header__logo" src="images/logo.png" alt="Логотип" />
    <button class="header__burger" id="burger">&equiv;</button>

    <nav class="nav" id="nav">
      <ul class="nav__list">
        <li class="nav__item">
          <a href="#" class="nav__link" onclick="showPage('home')">Главная</a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link" onclick="showPage('books')">Каталог</a>
        </li>
      </ul>
    </nav>
  </div>

  <div class="header__bottom">
    <h1 class="header__title">Digital Library</h1>
  </div>
</header>

<div class="layout">

<section id="home" class="news">
  <h2 class="news__title">Новости</h2>

  <form id="news-form" class="news-form">
    <input id="news-title" class="form-input" placeholder="Заголовок" required>
    <textarea id="news-text" class="form-textarea" placeholder="Текст" required></textarea>
    <button class="button button--primary">Добавить</button>
  </form>

  <input id="news-search" class="form-input" placeholder="Поиск новостей">

  <div id="news-list" class="news-list"></div>
</section>

<section id="books" class="books" style="display:none;">
  <h2 class="books__title">Книги</h2>

  <form id="book-form" class="book-form">
    <input id="book-title" class="form-input" placeholder="Название" required>
    <input id="book-author" class="form-input" placeholder="Автор" required>
    <button class="button button--primary">Добавить</button>
  </form>

  <select id="sort-books" class="form-input">
    <option value="title">По названию</option>
    <option value="date">По дате</option>
  </select>

  <div id="books-list" class="books-list"></div>
</section>

<section id="book-page" style="display:none;">
  <button class="button button--secondary" onclick="showPage('books')">Назад</button>

  <main class="main-content">

    <article class="book-card">
      <header class="book-card__header">
        <h2 class="book-card__title">Война и мир</h2>
      </header>

      <figure class="figure">
        <img class="figure__image" src="images/book1.png" alt="Обложка">
        <figcaption class="figure__caption">Классический роман Льва Толстого</figcaption>
      </figure>

      <section class="section">
        <h3 class="section__title">Описание книги</h3>
        <p class="section__text">Роман-эпопея</p>
      </section>

      <div class="favorite-button-container">
        <button class="button button--favorite" data-book-id="war-and-peace">
          <span class="favorite-icon">♥</span> В избранное
        </button>
      </div>
    </article>

    <section class="reviews-section">
      <h2 class="reviews-section__title">Отзывы</h2>

      <div id="reviews-list"></div>

      <form id="review-form" class="reviews-form">
        <input id="review-name" class="form-input" placeholder="Имя" required>
        <textarea id="review-text" class="form-textarea" required></textarea>

        <div id="rating-input">
          <span class="star" data-rating="1">★</span>
          <span class="star" data-rating="2">★</span>
          <span class="star" data-rating="3">★</span>
          <span class="star" data-rating="4">★</span>
          <span class="star" data-rating="5">★</span>
        </div>

        <input type="hidden" id="review-rating" value="0">

      <button class="button button--primary">Отправить</button>
      </form>
    </section>

  </main>
</section>

</div>

<footer class="footer">
  <p class="footer__text">&copy; 2026 Digital Library</p>
</footer>

<script type="module" src="js/script.js"></script>

</body>
</html>
